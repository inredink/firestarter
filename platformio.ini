; ============================================================================
; FLCL - FIRE STARTER: Dedicated ESP32-S3 Handheld Firmware (PlatformIO)
; ============================================================================
; Open this folder in VS Code with the PlatformIO IDE extension installed,
; connect your ESP32-S3 board over USB-C, and click "Upload" (or run
; `pio run -t upload`).
;
; All game assets (17 PNGs, 2 .NWS sprites, bitmap fonts, 2 WAV sound effects,
; and 2 XM/IT tracker songs) are compiled directly into Flash (.rodata) via
; src/platform/EmbeddedAssetsData.h — no SD card or LittleFS upload required!
; ============================================================================

[platformio]
default_envs = adafruit_feather_esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = huge_app.csv

build_src_filter =
    +<*>
    -<aatext.cpp>

build_flags =
    -O2
    -DFIRESTARTER_PLATFORM_ESP32
    -DFIRESTARTER_DISPLAY_WIDTH=240
    -DFIRESTARTER_DISPLAY_HEIGHT=320
    -DFIRESTARTER_WINDOW_SCALE=1
    -Isrc
    -Isrc/platform/esp32_shim
    -Isrc/platform/dumb/include

[env:adafruit_feather_esp32s3]
board = adafruit_feather_esp32s3

[env:waveshare_esp32_s3_pico]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
